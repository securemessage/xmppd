# Multi-worker e2e regression lane (T173).
#
# Runs the slixmpp integration suites against a throwaway instance with
# [core] workers = 4, exercising the cross-worker surface (room sharding,
# actor messages, MPSC delivery with ABA generation validation) that
# workers = 1 cannot reach. Driver: test/integration/run-multiworker.sh.
name: multiworker-e2e

# Tag pushes are excluded: pushing master + a release tag together would
# otherwise start two runs concurrently on the same runner, and two lane
# instances sharing the fixed port via SO_REUSEPORT cross-connect each
# other's clients (observed 2026-08-31: runs 1529/1531 failing on
# cross-worker timeouts while the same suites passed locally).
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  multiworker:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: Environment probe
        run: |
          uname -a
          id
          for t in zig python3 nc openssl git; do command -v $t || echo "MISSING: $t"; done
      - name: Provision python3 + slixmpp deps (if missing)
        run: |
          command -v python3 || doas pkg install -y python3
          # slixmpp's C deps from packages — pip would build pycares from
          # source (needs cmake). py312-* matches the python3 metaport (3.12).
          doas pkg install -y py312-pycares py312-aiodns py312-cffi \
            py312-pycparser py312-pyasn1 py312-pyasn1-modules
          python3 --version
      - name: slixmpp venv (system site-packages for the C deps)
        run: |
          python3 -m venv --system-site-packages /tmp/slixvenv-ci
          /tmp/slixvenv-ci/bin/pip install --quiet --no-deps slixmpp==1.17.0
          /tmp/slixvenv-ci/bin/python -c "import slixmpp; print(slixmpp.__version__)"
      # archive-storage=lmdb: no system rocksdb on the bare runner (lmdb is a
      # zig-fetchable dependency, sqlite3 is a private base lib — neither of
      # the other backends links on a package-free host).
      - name: Build
        run: zig build -Darchive-storage=lmdb
      - name: MUC + subscription at workers=4
        run: |
          SLIXPYTHON=/tmp/slixvenv-ci/bin/python \
            sh test/integration/run-multiworker.sh 4 muc-test.py e2e-subscription.py
