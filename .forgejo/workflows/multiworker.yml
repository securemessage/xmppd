# Multi-worker e2e regression lane (T173).
#
# Runs the slixmpp integration suites against a throwaway instance with
# [core] workers = 4, exercising the cross-worker surface (room sharding,
# actor messages, MPSC delivery with ABA generation validation) that
# workers = 1 cannot reach. Driver: test/integration/run-multiworker.sh.
name: multiworker-e2e

on:
  push:
  pull_request:

jobs:
  multiworker:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: Environment probe
        run: |
          uname -a
          id
          for t in zig python3 nc openssl git; do command -v $t || echo "MISSING: $t"; done
      - name: Provision python3 (if missing)
        run: |
          command -v python3 || doas pkg install -y python3
          python3 --version
      # archive-storage=lmdb: no system rocksdb on the bare runner (lmdb is a
      # zig-fetchable dependency, sqlite3 is a private base lib — neither of
      # the other backends links on a package-free host).
      - name: Build
        run: zig build -Darchive-storage=lmdb
      - name: slixmpp venv
        run: |
          python3 -m venv /tmp/slixvenv-ci
          /tmp/slixvenv-ci/bin/pip install --quiet slixmpp==1.17.0
      - name: MUC + subscription at workers=4
        run: |
          SLIXPYTHON=/tmp/slixvenv-ci/bin/python \
            sh test/integration/run-multiworker.sh 4 muc-test.py e2e-subscription.py
