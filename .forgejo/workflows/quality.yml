# M4 quality lane (T-4D163119, plan rule 5/6 and section 8 rule 10).
#
# Three ratchets that may only move in the good direction:
#   1. Stack frames: no NEW src/core function with a frame over 16 KiB
#      (objdump report against the allow-list).
#   2. Counting allocator: the established 1:1 stanza path must not add
#      alloc calls over the baseline ceiling.
#   3. Silent catches: `catch {}` / `catch return` / `catch continue` /
#      `catch false` counts may never exceed the TSV baseline.
#
# Runs on the FreeBSD runner with base-system tools only, like the
# consistency lane.
name: quality

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4
      # archive-storage=lmdb keeps the build package-free (see multiworker).
      - name: Build xmppd-core
        run: zig build -Darchive-storage=lmdb
      - name: Stack-frame report (no new frames over 16 KiB in src/core)
        run: sh test/quality/stack_frames.sh zig-out/bin/xmppd-core
      - name: Silent-catch ratchet
        run: sh test/quality/catch_ratchet.sh
      - name: Counting-allocator 1:1 path check
        run: zig build alloc-test -Darchive-storage=lmdb
