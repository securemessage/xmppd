# Feature-matrix consistency check (PoC).
#
# Runs the source-level drift guard that keeps caps.SERVER_FEATURES, the
# disco#info response, and the README XEP matrix in agreement. See
# test/consistency/README.md for the rationale (originates from T163).
#
# Runs on the FreeBSD runner (runner01: labels FreeBSD / FreeBSD-15.0 /
# FreeBSD-container) — the project's target platform. The check itself is pure
# python3 with no third-party packages, so any of those labels works; the
# generic `FreeBSD` label is used so it isn't pinned to one OS minor.
#
# If this runner cannot execute JS actions (no node for actions/checkout),
# switch to the `FreeBSD-container` label or replace the checkout step with a
# manual `git clone`.
name: consistency

on:
  push:
  pull_request:

jobs:
  xep-matrix:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: XEP feature-matrix consistency
        run: python3 test/consistency/check_xep_matrix.py
