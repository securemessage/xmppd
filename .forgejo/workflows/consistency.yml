# Feature-matrix consistency check (PoC).
#
# Runs the source-level drift guard that keeps caps.SERVER_FEATURES, the
# disco#info response, and the README XEP matrix in agreement. See
# test/consistency/README.md for the rationale (originates from T163).
#
# Runs on the FreeBSD runner (runner01: labels FreeBSD / FreeBSD-15.0 /
# FreeBSD-container) — the project's target platform. The check uses only
# base-system sh + awk (no python, no packages), so it runs on a bare FreeBSD
# host executor; the generic `FreeBSD` label keeps it off a pinned OS minor.
name: consistency

on:
  push:
  pull_request:

jobs:
  xep-matrix:
    runs-on: FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: XEP feature-matrix consistency
        run: sh test/consistency/check_xep_matrix.sh
