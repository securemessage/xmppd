# Feature-matrix consistency check (PoC).
#
# Runs the source-level drift guard that keeps caps.SERVER_FEATURES, the
# disco#info response, and the README XEP matrix in agreement. See
# test/consistency/README.md for the rationale (originates from T163).
#
# NOTE: `runs-on` uses a generic label. Adjust it to match a label this
# Forgejo instance's runner actually advertises (e.g. `docker`, `native`,
# or a self-hosted FreeBSD label). The step itself needs only python3 and no
# third-party packages.
name: consistency

on:
  push:
  pull_request:

jobs:
  xep-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: XEP feature-matrix consistency
        run: python3 test/consistency/check_xep_matrix.py
